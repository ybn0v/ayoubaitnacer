<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Ayoub Ait Nacer</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;600&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0c0f0e;--surface:#151a18;--border:#2a332e;
  --text:#e8e6e1;--dim:#8a9189;--accent:#4ade80;
  --glow:rgba(74,222,128,.12);
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'Outfit',-apple-system,sans-serif;
  --mono:'Space Mono',monospace;
}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
  align-items:center;justify-content:center;min-height:100vh;
  padding:24px;text-align:center;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity:.03;z-index:9999;
}
.glow-bg{
  position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 40% at 50% 50%,var(--glow),transparent);
}
.code{
  font-family:var(--mono);font-size:clamp(80px,18vw,160px);font-weight:400;
  background:linear-gradient(135deg,var(--accent),rgba(74,222,128,.2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1;margin-bottom:24px;position:relative;z-index:1;
}
h1{
  font-family:var(--serif);font-size:clamp(24px,4vw,40px);
  font-weight:400;font-style:italic;margin-bottom:16px;position:relative;z-index:1;
}
p{
  font-size:16px;color:var(--dim);max-width:400px;line-height:1.7;
  font-weight:300;margin-bottom:40px;position:relative;z-index:1;
}
.btn{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--accent);color:var(--bg);padding:14px 32px;border-radius:100px;
  font-weight:600;font-size:14px;text-decoration:none;transition:all .25s;
  position:relative;z-index:1;
}
.btn:hover{box-shadow:0 0 40px var(--glow);transform:translateY(-2px)}
.sub{margin-top:20px;font-size:12px;color:rgba(255,255,255,.2);position:relative;z-index:1}
.sub a{color:var(--dim);text-decoration:none;transition:color .2s}
.sub a:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="glow-bg"></div>
<div class="code">404</div>
<h1>Cette page n'existe pas.</h1>
<p>Vous avez suivi un lien cassé ou tapé une URL incorrecte. Pas de panique.</p>
<a href="/" class="btn">← Retour à l'accueil</a>
<p class="sub">
  Ou contactez-moi directement : <a href="mailto:ayoub.aitnacer@edu.edhec.com">ayoub.aitnacer@edu.edhec.com</a>
</p>
</body>
</html>
